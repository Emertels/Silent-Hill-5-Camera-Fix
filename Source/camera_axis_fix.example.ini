; Patch Fix Camera 1.0 - By Emerson Teles
; Silent Hill: Homecoming - Unknown Project 3.20
; Main speed settings: decimal point, range 0.25 to 3.0.
; Close and restart the game after editing.
[Camera]

; Normal horizontal camera and character turning. 1.0 uses a 1.5 rad/s reference.
HorizontalCameraSpeed=1.0

; Normal vertical camera. New 1.0 equals previous 2.0 (user-selected calibration). Effective gain: 2.864788997846 * setting.
VerticalCameraSpeed=1.0

; Precision aiming: horizontal multiplier applied after the native response curve. 3.0 equals the earlier fast reference.
AimHorizontalSpeed=1.0

; Precision aiming: independent vertical multiplier, applied after the native response curve.
AimVerticalSpeed=1.0



; Legacy horizontal input curve. Keep 1.0 for a neutral curve.
RightStickXExponent=1.0

; Legacy vertical input curve. Keep 1.0 for a neutral curve.
RightStickYExponent=1.0

; Legacy raw horizontal stick gain. Keep 1.0 to avoid stacking input gains.
RightStickXGain=1.0

; Legacy raw vertical stick gain. Keep 1.0 to avoid stacking input gains.
RightStickYGain=1.0



